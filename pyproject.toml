[project]
name = "bookly-support-agent"
version = "0.1.0"
description = "A customer support AI agent for Bookly, a fictional online bookstore."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
deck = ["python-pptx>=1.0.0"]  # only needed to regenerate deck/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookly"]
